# Atualizações de dependências automatizadas e agrupadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

