<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo LotusPsi — Flor de Lótus e Prontuário">
  <defs>
    <!-- Gradiente de fundo do ícone (Squircle Linho Suave) -->
    <linearGradient id="lotus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7EFF3" />
    </linearGradient>

    <!-- Gradiente da Pétala Central -->
    <linearGradient id="petala-centro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C27D9A" />
      <stop offset="60%" stop-color="#AC6E87" />
      <stop offset="100%" stop-color="#7D465C" />
    </linearGradient>

    <!-- Gradiente das Pétalas Médias -->
    <linearGradient id="petala-media" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4C5D7" />
      <stop offset="60%" stop-color="#D98FA9" />
      <stop offset="100%" stop-color="#9C5973" />
    </linearGradient>

    <!-- Gradiente das Pétalas Externas -->
    <linearGradient id="petala-externa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8F0" />
      <stop offset="60%" stop-color="#EAAAC1" />
      <stop offset="100%" stop-color="#BA718D" />
    </linearGradient>

    <!-- Gradiente Dourado (Ponto de Luz) -->
    <linearGradient id="luz-dourada" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1BA" />
      <stop offset="50%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#BD8638" />
    </linearGradient>

    <!-- Gradiente Sálvia (Folhas / Base do Prontuário) -->
    <linearGradient id="salvia-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F9282" />
      <stop offset="50%" stop-color="#84A797" />
      <stop offset="100%" stop-color="#6F9282" />
    </linearGradient>
    
    <!-- Sombra suave para relevo -->
    <filter id="lotus-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6E3A4E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo Squircle Suave e Elegante -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#lotus-bg)" stroke="#E9BFD5" stroke-width="7" filter="url(#lotus-shadow)" />

  <!-- Base: Prontuário Aberto em Formato de Asas de Acolhimento -->
  <!-- Folha inferior / Capa -->
  <path d="M 112 400 C 180 376 232 390 256 410 C 280 390 332 376 400 400" fill="none" stroke="#92798F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  
  <!-- Páginas principais abertas (curvatura elegante de livro) -->
  <path d="M 96 376 C 172 348 230 368 256 390 C 282 368 340 348 416 376" fill="none" stroke="url(#salvia-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Centro da costura do prontuário -->
  <circle cx="256" cy="390" r="7" fill="#7A9A8B" />

  <!-- Flor de Lótus Desabrochando -->
  <g id="lotus-flower">
    <!-- Pétalas Externas (abertas, transmitindo expansão) -->
    <path d="M 256 348 C 176 342 120 286 130 220 C 176 226 224 280 256 348 Z" fill="url(#petala-externa)" opacity="0.9" />
    <path d="M 256 348 C 336 342 392 286 382 220 C 336 226 288 280 256 348 Z" fill="url(#petala-externa)" opacity="0.9" />

    <!-- Pétalas Médias (intermediárias, harmonia) -->
    <path d="M 256 348 C 196 338 160 274 176 200 C 218 206 248 268 256 348 Z" fill="url(#petala-media)" opacity="0.95" />
    <path d="M 256 348 C 316 338 352 274 336 200 C 294 206 264 268 256 348 Z" fill="url(#petala-media)" opacity="0.95" />

    <!-- Pétala Central (alta, despertar da consciência e cura) -->
    <path d="M 256 122 C 304 186 304 278 256 348 C 208 278 208 186 256 122 Z" fill="url(#petala-centro)" />

    <!-- Ponto Solar / Centelha de Cura e Esperança no Ápice -->
    <circle cx="256" cy="108" r="13" fill="url(#luz-dourada)" filter="url(#lotus-shadow)" />
  </g>
</svg>
