[package]
name = "lc-pacientes"
version = "0.1.0"
description = "Sistema de Pacientes e Documentos — Louriedna Costa Pereira"
authors = ["Felipe"]
edition = "2021"

[lib]
name = "lc_pacientes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
